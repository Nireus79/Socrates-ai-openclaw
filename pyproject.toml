[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "socrates-ai-openclaw"
version = "0.1.1"
description = "OpenClaw framework integration for Socrates AI - Socratic method discovery skill"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Efthimios Angelopoulos", email = "Hermes_creative@proton.me"}
]
keywords = ["socrates", "ai", "openclaw", "discovery", "skill", "framework"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "socratic-core>=0.1.1,<0.1.4",
    "anthropic>=0.40.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[project.urls]
Homepage = "https://github.com/Nireus79/Socrates-ai-openclaw"
Repository = "https://github.com/Nireus79/Socrates-ai-openclaw"
Issues = "https://github.com/Nireus79/Socrates-ai-openclaw/issues"
Documentation = "https://github.com/Nireus79/Socrates-ai-openclaw#readme"

[tool.setuptools]
packages = ["socratic_openclaw_skill"]
package-dir = {"" = "src"}

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311", "py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
